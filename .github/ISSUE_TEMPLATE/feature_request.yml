name: Feature request
description: An idea that would make FolderServe more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, not the solution. "I need to … but …"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like FolderServe to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
