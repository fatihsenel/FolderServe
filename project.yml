name: FolderServe
options:
  bundleIdPrefix: com.fatihsenel
  deploymentTarget:
    macOS: "14.0"
packages:
  FolderServeCore:
    path: Packages/FolderServeCore
targets:
  FolderServe:
    type: application
    platform: macOS
    sources: [FolderServe]
    dependencies:
      - package: FolderServeCore
    info:
      path: FolderServe/Info.plist
      properties:
        # The API proxy forwards to whatever URL the user configures, including plain-http hosts.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Standard TLS from the system only (the HTTPS option); declared so App Store Connect does not ask on every upload.
        ITSAppUsesNonExemptEncryption: false
        # Share on network makes the folder reachable from other devices on the same network.
        NSLocalNetworkUsageDescription: "FolderServe makes a folder reachable from other devices on your network, only while Share is switched on."
        # Finder ▸ right-click a folder ▸ Services ▸ Serve with FolderServe (see FolderServeAppDelegate.serveFolders).
        NSServices:
          - NSMenuItem:
              default: Serve with FolderServe
            NSMessage: serveFolders
            NSPortName: FolderServe
            NSSendFileTypes: [public.folder]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.html]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fatihsenel.FolderServe
        CODE_SIGN_ENTITLEMENTS: FolderServe/FolderServe.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MARKETING_VERSION: "0.1.10"
        CURRENT_PROJECT_VERSION: "11"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FolderServeTests:
    type: bundle.unit-test
    platform: macOS
    sources: [FolderServeTests]
    dependencies:
      - target: FolderServe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        CODE_SIGN_IDENTITY: "-"
schemes:
  FolderServe:
    build:
      targets:
        FolderServe: all
    test:
      targets: [FolderServeTests]
