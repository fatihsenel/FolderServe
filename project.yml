name: FolderServe
options:
  bundleIdPrefix: com.fatihsenel
  deploymentTarget:
    macOS: "14.0"
packages:
  FolderServeCore:
    path: Packages/FolderServeCore
targets:
  FolderServe:
    type: application
    platform: macOS
    sources: [FolderServe]
    dependencies:
      - package: FolderServeCore
    info:
      path: FolderServe/Info.plist
      properties:
        # The API proxy forwards to whatever URL the user configures, including plain-http hosts.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.html]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fatihsenel.FolderServe
        CODE_SIGN_ENTITLEMENTS: FolderServe/FolderServe.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MARKETING_VERSION: "0.1.4"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FolderServeTests:
    type: bundle.unit-test
    platform: macOS
    sources: [FolderServeTests]
    dependencies:
      - target: FolderServe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        CODE_SIGN_IDENTITY: "-"
schemes:
  FolderServe:
    build:
      targets:
        FolderServe: all
    test:
      targets: [FolderServeTests]
