name: FolderServe
options:
  bundleIdPrefix: com.fatihsenel
  deploymentTarget:
    macOS: "14.0"
packages:
  FolderServeCore:
    path: Packages/FolderServeCore
targets:
  FolderServe:
    type: application
    platform: macOS
    sources: [FolderServe]
    dependencies:
      - package: FolderServeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fatihsenel.FolderServe
        CODE_SIGN_ENTITLEMENTS: FolderServe/FolderServe.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  FolderServe:
    build:
      targets:
        FolderServe: all
    test:
      targets: []
